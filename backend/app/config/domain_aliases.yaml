# Domain Vocabulary & Alias Configuration
# =========================================
# Purpose: Normalize informal/abbreviated site language to canonical activity
# and location terms before AI matching. This file is loaded at runtime and can
# be edited without any code changes.
#
# Format:
#   Each key is the CANONICAL term (matches schedule activity or location name).
#   Each value is a list of aliases: abbreviations, informal terms, common typos,
#   or domain-specific shorthand that should map to that canonical term.
#
# Rules:
#   - Matching is case-insensitive.
#   - Longer aliases are matched before shorter ones (prevents partial mismatch).
#   - Typos are listed explicitly (not computed); only add if confirmed common.
#   - This is a shared project-level vocabulary. Project teams should add
#     project-specific aliases here (e.g., specific site codes, local names).
#
# Do NOT add generic English words here — only domain/project-specific terms.

# ---------------------------------------------------------------------------
# Activity Aliases
# ---------------------------------------------------------------------------
